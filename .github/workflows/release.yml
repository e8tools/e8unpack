name: Release

# Сборка и публикация e8unpack.
#
#  * push в release_develop — сборка, тесты и артефакты, плюс обновление
#    ЧЕРНОВОГО prerelease (тег-указатель release_develop-latest);
#  * push тега вида v3.0.44 — сборка, тесты и опубликованный GitHub Release;
#  * вручную (workflow_dispatch) — сборка и тесты с любого рефа.
#
# Ветка master здесь не участвует.
#
# Версия берётся из тега; для сборок по ветке — из src/version.h с суффиксом
# -dev.<номер прогона>.
#
# Если шаг сборки или тестов падает, последние 40 строк вывода печатаются
# через ::error:: и видны в аннотациях (логи Actions требуют входа в аккаунт).

on:
  push:
    branches:
      - release_develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────── Linux x86_64
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Зависимости
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build \
            qt6-base-dev \
            libboost-filesystem-dev libboost-system-dev libboost-iostreams-dev \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev

      - name: Определение версии
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            BASE="$(sed -n 's/^#define V8P_VERSION "\(.*\)"/\1/p' src/version.h | head -1)"
            V="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${V}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Конфигурация
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Сборка
        run: |
          set +e
          cmake --build build -j2 > build-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 build-step.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            tail -3 build-step.log
          fi
          exit $rc

      - name: Тесты
        run: |
          set +e
          bash test/run.sh build/v8unpack > test-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 test-step.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            cat test-step.log
          fi
          exit $rc

      - name: Тесты (кириллица в путях)
        run: |
          set +e
          bash test/run-cyrillic.sh build/v8unpack > cyr-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 cyr-step.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            cat cyr-step.log
          fi
          exit $rc

      - name: Упаковка tar.gz и .deb
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          NAME="v8unpack-${V}-linux-x86_64"
          mkdir -p "dist/${NAME}"
          install -m755 build/v8unpack "dist/${NAME}/v8unpack"
          install -m644 README.md      "dist/${NAME}/README.md"
          install -m644 LICENSE        "dist/${NAME}/LICENSE"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"

          # .deb собираем вручную: заготовка debian/ рассчитана на debhelper 9
          # и устарела, а нам нужен контроль версии прямо из тега.
          ROOT="dist/deb-root"
          install -Dm755 build/v8unpack "${ROOT}/usr/bin/v8unpack"
          install -Dm644 README.md      "${ROOT}/usr/share/doc/v8unpack/README.md"
          install -Dm644 LICENSE        "${ROOT}/usr/share/doc/v8unpack/copyright"
          mkdir -p "${ROOT}/DEBIAN"
          cat > "${ROOT}/DEBIAN/control" <<EOF
          Package: v8unpack
          Version: ${V}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: e8tools <https://github.com/e8tools/e8unpack>
          Description: Enterprise 8 unpack tool
          EOF
          dpkg-deb --build --root-owner-group "${ROOT}" "dist/v8unpack_${V}_amd64.deb"

          echo "=== файлы ==="
          ls -lh dist/*.tar.gz dist/*.deb

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────── Windows x64 (MinGW)
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "MSYS2 UCRT64: Qt6, Boost, zlib"
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            coreutils
            diffutils
            zip

      - name: Определение версии
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            BASE="$(sed -n 's/^#define V8P_VERSION "\(.*\)"/\1/p' src/version.h | head -1)"
            V="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${V}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Конфигурация
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBoost_USE_STATIC_LIBS=ON \
            -DZLIB_USE_STATIC_LIBS=ON

      - name: Сборка
        run: |
          set +e
          cmake --build build -j2 > build-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 build-step.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            tail -3 build-step.log
          fi
          exit $rc

      - name: Тесты
        run: |
          set +e
          bash test/run.sh build/v8unpack.exe > test-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            {
              echo "=== test/run.sh ==="
              cat test-step.log
              echo "=== diff.log ==="
              cat diff.log 2>/dev/null | head -40
              echo "=== доступность утилит ==="
              for t in dd seq expr diff; do
                printf "%s: %s\n" "$t" "$(command -v $t || echo НЕТ)"
              done
            } > diag.log 2>&1
            mapfile -t L < <(tail -40 diag.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            cat test-step.log
          fi
          exit $rc

      - name: Тесты (кириллица в путях)
        run: |
          set +e
          bash test/run-cyrillic.sh build/v8unpack.exe > cyr-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 cyr-step.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            cat cyr-step.log
          fi
          exit $rc

      - name: Упаковка .zip
        run: |
          set +e
          (
            set -euo pipefail
            V="${{ steps.ver.outputs.version }}"
            NAME="v8unpack-${V}-win64"
            mkdir -p "dist/${NAME}"
            cp build/v8unpack.exe "dist/${NAME}/v8unpack.exe"
            cp README.md         "dist/${NAME}/README.md"
            cp LICENSE           "dist/${NAME}/LICENSE"

            # Qt и его зависимости линкуются динамически: собираем замыкание
            # рекурсивно по таблицам импорта. Ручной список пропускал транзитив
            # (Qt6Core тянет ICU, zstd, pcre2, b2, double-conversion), и на
            # чистой Windows не хватало libicuuc78.dll.
            PY=python
            command -v "$PY" >/dev/null 2>&1 || PY=python3
            echo "интерпретатор: $(command -v "$PY")"
            "$PY" .github/scripts/bundle-windows-dlls.py \
              --exe build/v8unpack.exe \
              --prefix "${MINGW_PREFIX}/bin" \
              --dest "dist/${NAME}"

            echo "=== каталог выпуска ==="
            ls -1 "dist/${NAME}" | sort
            ( cd dist && zip -r "${NAME}.zip" "${NAME}" )
          ) > pack.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 pack.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            cat pack.log
          fi
          exit $rc

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  # ─────────────────────────────────── Черновой prerelease (push в release_develop)
  prerelease:
    name: Черновой prerelease
    needs: [linux, windows]
    if: github.ref == 'refs/heads/release_develop'
    runs-on: ubuntu-24.04
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Файлы
        run: find dist -type f -printf '%s\t%p\n' | sort -k2

      # Тег-указатель без префикса v: он не попадает под фильтр tags: 'v*'
      # и поэтому не запускает этот workflow повторно.
      - name: Обновить тег-указатель
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f release_develop-latest "${GITHUB_SHA}"
          git push -f origin release_develop-latest

      - name: Обновить черновой prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release_develop-latest
          name: "Черновик release_develop (${{ needs.linux.outputs.version }})"
          body: |
            Проверочная сборка ветки `release_develop`, версия
            `${{ needs.linux.outputs.version }}`, коммит ${{ github.sha }}.

            Это черновик: он не виден публично и обновляется при каждом push
            в `release_develop`. Внутри — те же файлы, что публикуются в
            реальном релизе по тегу.
          draft: true
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip

  # ──────────────────────────────────────────────────────── GitHub Release (тег)
  release:
    name: Публикация релиза
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Что публикуем
        run: find dist -type f -printf '%s\t%p\n' | sort -k2

      - name: Создание релиза
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
