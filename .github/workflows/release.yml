name: Release

# Сборка и публикация e8unpack.
#
#  * push в release_develop — сборка, тесты и артефакты, плюс обновление
#    ЧЕРНОВОГО prerelease (тег-указатель release_develop-latest);
#  * push тега вида v3.0.44 — сборка, тесты и опубликованный GitHub Release;
#  * вручную (workflow_dispatch) — сборка и тесты с любого рефа.
#
# Ветка master здесь не участвует.
#
# Версия берётся из тега; для сборок по ветке — из src/version.h с суффиксом
# -dev.<номер прогона>.
#
# Если шаг сборки или тестов падает, последние 40 строк вывода печатаются
# через ::error:: и видны в аннотациях (логи Actions требуют входа в аккаунт).

on:
  push:
    branches:
      - release_develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ─────────────────────────────────────────────────────────────── Linux x86_64
  # Сборка идёт в контейнере Debian 12, а не на ubuntu-24.04. У ubuntu-24.04
  # glibc 2.39 и GCC 13, и бинарник требует GLIBC_2.38 / GLIBCXX_3.4.32: на
  # Astra Linux и дистрибутивах постарше это «cannot open shared object file»
  # и «version `GLIBC_2.38' not found». Debian 12 даёт glibc 2.36, GCC 12 и
  # Qt 6.4, а несистемные библиотеки (Qt, ICU, glib, pcre2, zstd, zlib, b2,
  # double-conversion, libstdc++, libgcc, libgomp) складываются в архив рядом
  # с бинарником — на машине пользователя не требуется ни Qt6, ни что-либо ещё.
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Определение версии
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            BASE="$(sed -n 's/^#define V8P_VERSION "\(.*\)"/\1/p' src/version.h | head -1)"
            V="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${V}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Сборка, тесты и упаковка (Debian 12)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set +e
          docker run --rm -v "$PWD:/src" -w /src \
            -e "VERSION=${VERSION}" -e LANG=C.UTF-8 -e LC_ALL=C.UTF-8 \
            debian:12 bash -c '
              set -Eeuo pipefail
              # Весь вывод — в один поток: иначе docker перемешивает stdout и
              # stderr и настоящая ошибка не попадает в конец лога.
              exec 2>&1
              trap "echo \"=== ОШИБКА на этапе: \${STAGE:-неизвестно}: \${BASH_COMMAND}\"" ERR

              STAGE="apt: установка зависимостей"
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                build-essential cmake ninja-build python3 patchelf diffutils \
                qt6-base-dev \
                libboost-filesystem-dev libboost-system-dev libboost-iostreams-dev \
                zlib1g-dev libbz2-dev liblzma-dev libzstd-dev

              STAGE="cmake: конфигурация"
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

              STAGE="сборка"
              cmake --build build -j"$(nproc)"

              STAGE="тесты"
              bash test/run.sh build/v8unpack
              bash test/run-cyrillic.sh build/v8unpack

              STAGE="упаковка: архив"
              NAME="v8unpack-${VERSION}-linux-x86_64"
              mkdir -p "dist/${NAME}/lib"
              install -m755 build/v8unpack "dist/${NAME}/v8unpack"
              install -m644 README.md      "dist/${NAME}/README.md"
              install -m644 LICENSE        "dist/${NAME}/LICENSE"

              python3 .github/scripts/bundle-linux-libs.py \
                --exe "dist/${NAME}/v8unpack" --dest "dist/${NAME}/lib"

              # $ORIGIN/lib — для распакованного архива,
              # $ORIGIN/../lib/v8unpack — для установленного из .deb
              patchelf --set-rpath "\$ORIGIN/lib:\$ORIGIN/../lib/v8unpack" "dist/${NAME}/v8unpack"

              STAGE="проверка замыкания зависимостей"
              python3 .github/scripts/bundle-linux-libs.py --check --dir "dist/${NAME}"

              tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"

              STAGE="упаковка: .deb"
              ROOT="dist/deb-root"
              install -Dm755 "dist/${NAME}/v8unpack" "${ROOT}/usr/bin/v8unpack"
              mkdir -p "${ROOT}/usr/lib/v8unpack"
              cp -a "dist/${NAME}/lib/." "${ROOT}/usr/lib/v8unpack/"
              install -Dm644 README.md "${ROOT}/usr/share/doc/v8unpack/README.md"
              install -Dm644 LICENSE   "${ROOT}/usr/share/doc/v8unpack/copyright"
              mkdir -p "${ROOT}/DEBIAN"
              printf "%s\n" \
                "Package: v8unpack" \
                "Version: ${VERSION}" \
                "Section: utils" \
                "Priority: optional" \
                "Architecture: amd64" \
                "Maintainer: e8tools <https://github.com/e8tools/e8unpack>" \
                "Description: Enterprise 8 unpack tool" \
                > "${ROOT}/DEBIAN/control"
              dpkg-deb --build --root-owner-group "${ROOT}" "dist/v8unpack_${VERSION}_amd64.deb"

              STAGE="готово"
              echo "=== файлы ==="
              ls -lh dist/*.tar.gz dist/*.deb
              echo "=== состав архива ==="
              tar tzf "dist/${NAME}.tar.gz" | head -25
            ' > linux-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::шаг завершился с кодом $rc"
            tail -60 linux-step.log | sed "s/^/::error::/"
          else
            cat linux-step.log
          fi
          exit $rc

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────── Windows x64 (MinGW)
  windows:
    name: Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: "MSYS2 UCRT64: Qt6, Boost, zlib"
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-python
            coreutils
            diffutils
            zip

      - name: Определение версии
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            BASE="$(sed -n 's/^#define V8P_VERSION "\(.*\)"/\1/p' src/version.h | head -1)"
            V="${BASE}-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${V}"
          echo "version=${V}" >> "$GITHUB_OUTPUT"

      - name: Конфигурация
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBoost_USE_STATIC_LIBS=ON \
            -DZLIB_USE_STATIC_LIBS=ON

      - name: Сборка
        run: |
          set +e
          cmake --build build -j2 > build-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 build-step.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            tail -3 build-step.log
          fi
      - name: Тесты
        run: |
          set +e
          bash test/run.sh build/v8unpack.exe > test-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then lvl=error; else lvl=notice; fi
          {
            echo "=== test/run.sh: код $rc ==="
            cat test-step.log
          } > diag.log 2>&1
          mapfile -t L < <(tail -40 diag.log)
          for l in "${L[@]}"; do echo "::$lvl::$l"; done
          exit $rc


      - name: Тесты (кириллица в путях)
        run: |
          set +e
          bash test/run-cyrillic.sh build/v8unpack.exe > cyr-step.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 cyr-step.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            cat cyr-step.log
          fi
          exit $rc

      - name: Упаковка .zip
        run: |
          set +e
          (
            set -euo pipefail
            V="${{ steps.ver.outputs.version }}"
            NAME="v8unpack-${V}-win64"
            mkdir -p "dist/${NAME}"
            cp build/v8unpack.exe "dist/${NAME}/v8unpack.exe"
            cp README.md         "dist/${NAME}/README.md"
            cp LICENSE           "dist/${NAME}/LICENSE"

            # Qt и его зависимости линкуются динамически: собираем замыкание
            # рекурсивно по таблицам импорта. Ручной список пропускал транзитив
            # (Qt6Core тянет ICU, zstd, pcre2, b2, double-conversion), и на
            # чистой Windows не хватало libicuuc78.dll.
            PY=python
            command -v "$PY" >/dev/null 2>&1 || PY=python3
            echo "интерпретатор: $(command -v "$PY")"
            "$PY" .github/scripts/bundle-windows-dlls.py \
              --exe build/v8unpack.exe \
              --prefix "${MINGW_PREFIX}/bin" \
              --dest "dist/${NAME}"

            echo "=== каталог выпуска ==="
            ls -1 "dist/${NAME}" | sort
            ( cd dist && zip -r "${NAME}.zip" "${NAME}" )
          ) > pack.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            mapfile -t L < <(tail -40 pack.log)
            for l in "${L[@]}"; do echo "::error::$l"; done
          else
            cat pack.log
          fi
          exit $rc

      - name: Артефакты
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  # ─────────────────────────────────── Черновой prerelease (push в release_develop)
  prerelease:
    name: Черновой prerelease
    needs: [linux, windows]
    if: github.ref == 'refs/heads/release_develop'
    runs-on: ubuntu-24.04
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Файлы
        run: find dist -type f -printf '%s\t%p\n' | sort -k2

      # Тег-указатель без префикса v: он не попадает под фильтр tags: 'v*'
      # и поэтому не запускает этот workflow повторно.
      - name: Обновить тег-указатель
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f release_develop-latest "${GITHUB_SHA}"
          git push -f origin release_develop-latest

      - name: Обновить черновой prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release_develop-latest
          name: "Черновик release_develop (${{ needs.linux.outputs.version }})"
          body: |
            Проверочная сборка ветки `release_develop`, версия
            `${{ needs.linux.outputs.version }}`, коммит ${{ github.sha }}.

            Это черновик: он не виден публично и обновляется при каждом push
            в `release_develop`. Внутри — те же файлы, что публикуются в
            реальном релизе по тегу.
          draft: true
          prerelease: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip

  # ──────────────────────────────────────────────────────── GitHub Release (тег)
  release:
    name: Публикация релиза
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Получение исходников
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Скачивание артефактов
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Что публикуем
        run: find dist -type f -printf '%s\t%p\n' | sort -k2

      # Описание выпуска лежит в репозитории: docs/release-notes/<тег>.md.
      # Файл должен попасть в тот же коммит, на который поставлен тег.
      - name: Описание релиза
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" dist/release-body.md
            echo "описание: $NOTES"
          else
            PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            {
              echo "## Изменения"
              echo
              if [ -n "$PREV" ]; then
                git log --no-merges --pretty='- %s' "${PREV}..${GITHUB_REF_NAME}"
                echo
                echo "Полный список: https://github.com/${GITHUB_REPOSITORY}/compare/${PREV}...${GITHUB_REF_NAME}"
              else
                git log --no-merges --pretty='- %s' -20
              fi
            } > dist/release-body.md
            echo "описание: файла $NOTES нет, собрано из истории коммитов"
          fi
          echo "--- описание ---"
          cat dist/release-body.md

      - name: Создание релиза и загрузка артефактов
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
          fail_on_unmatched_files: true

      # Описание ставим явно через API: так результат проверяем, а итог
      # печатается аннотацией (логи Actions без входа в аккаунт не читаются).
      - name: Описание релиза в GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          V="${GITHUB_REF_NAME}"
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}"

          if [ ! -s dist/release-body.md ]; then
            echo "::error::описание dist/release-body.md отсутствует или пусто"
            exit 1
          fi
          echo "::notice::описание для ${V}: $(wc -c < dist/release-body.md) байт"

          python3 - <<'PY' > /tmp/body.json
          import json
          print(json.dumps({"body": open("dist/release-body.md", encoding="utf-8").read()}))
          PY

          ID="$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
                       -H "Accept: application/vnd.github+json" \
                       "${API}/releases/tags/${V}" \
                | python3 -c "import json,sys;print(json.load(sys.stdin).get('id',''))")"
          if [ -z "$ID" ]; then
            echo "::error::релиз ${V} не найден через API"
            exit 1
          fi

          curl -sS -X PATCH \
               -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/vnd.github+json" \
               -H "Content-Type: application/json" \
               --data @/tmp/body.json \
               "${API}/releases/${ID}" > /tmp/rel.json

          python3 -c "
          import json
          d = json.load(open('/tmp/rel.json'))
          if 'tag_name' not in d:
              print('::error::не удалось обновить описание: %s' % str(d)[:200]); raise SystemExit(1)
          print('::notice::%s: описание %d символов, файлов %d, %s'
                % (d['tag_name'], len(d['body'] or ''), len(d['assets']), d['html_url']))
          print(d['body'])
          "
